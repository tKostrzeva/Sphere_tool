<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sphere | v10</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="topbar">
    <button class="topbar-toggle" id="panelToggle">
      <span id="toggleArrow">←</span> options
    </button>
    <span class="topbar-title">Sphere | v10</span>
  </header>

  <div class="layout">

    <aside class="panel" id="panel">
      <div class="panel-content">

        <div class="ctrl">
          <label class="ctrl-label">Aspect ratio</label>
          <select id="sel-ratio">
            <option value="1:1" selected>1 : 1 — Square</option>
            <option value="5:4">5 : 4 — Landscape</option>
            <option value="4:3">4 : 3 — Landscape</option>
            <option value="16:10">16 : 10 — Landscape</option>
            <option value="16:9">16 : 9 — Landscape</option>
            <option value="4:5">4 : 5 — Portrait</option>
            <option value="3:4">3 : 4 — Portrait</option>
            <option value="9:16">9 : 16 — Portrait</option>
            <option value="1:1.41421">A4 — Portrait</option>
            <option value="1.41421:1">A4 — Landscape</option>
          </select>
        </div>

        <label class="section-label">Noise</label>

        <div class="ctrl">
          <label class="ctrl-label">Noise seed <span data-val="noise-seed-slider"></span></label>
          <input type="range" class="slider" id="noise-seed-slider" min="0" max="1000" value="42">
        </div>

        <div class="ctrl">
          <label class="ctrl-label">Noise scale <span data-val="noise-scale-slider"></span></label>
          <input type="range" class="slider" id="noise-scale-slider" min="1" max="100" value="3">
        </div>

        <div class="ctrl">
          <label class="ctrl-label">Off X <span data-val="noise-x-slider"></span></label>
          <input type="range" class="slider" id="noise-x-slider" min="0" max="1000" value="0">
        </div>

        <div class="ctrl">
          <label class="ctrl-label">Off Y <span data-val="noise-y-slider"></span></label>
          <input type="range" class="slider" id="noise-y-slider" min="0" max="1000" value="0">
        </div>

        <div class="ctrl">
          <label class="ctrl-label">Noise speed <span data-val="noise-speed-slider"></span></label>
          <input type="range" class="slider" id="noise-speed-slider" min="0" max="100" value="7">
        </div>

        <label class="section-label">Render</label>

        <div class="ctrl">
          <label class="ctrl-label">Render mode</label>
          <select id="render-mode">
            <option value="points" selected>Points</option>
            <option value="wireframe">Wireframe</option>
            <option value="rings">Latitude rings</option>
            <option value="meridians">Meridians</option>
            <option value="fill">Filled shell</option>
            <option value="spikes">Spikes</option>
          </select>
        </div>

        <div class="ctrl">
          <label class="ctrl-label">Glow intensity <span data-val="glow-slider"></span></label>
          <input type="range" class="slider" id="glow-slider" min="1" max="100" value="44">
        </div>

        <div class="ctrl">
          <label class="ctrl-label">Point size <span data-val="pointsize-slider"></span></label>
          <input type="range" class="slider" id="pointsize-slider" min="1" max="100" value="7">
        </div>

        <div class="ctrl">
          <label class="ctrl-label">Density <span data-val="density-slider"></span></label>
          <input type="range" class="slider" id="density-slider" min="1000" max="16000" step="100" value="11000">
        </div>

        <div class="ctrl">
          <label class="ctrl-label">Hollow <span data-val="hollow-slider"></span></label>
          <input type="range" class="slider" id="hollow-slider" min="0" max="100" value="50">
        </div>

        <div class="ctrl">
          <label class="ctrl-label">Color A</label>
          <div class="color-row">
            <input type="color" class="color-swatch" id="colorAPick" value="#FF65E9">
            <input type="text"  class="hex-in" id="colorA-hex" value="#FF65E9" maxlength="7" spellcheck="false">
          </div>
        </div>
        <div class="ctrl">
          <label class="ctrl-label">Color B</label>
          <div class="color-row">
            <input type="color" class="color-swatch" id="colorBPick" value="#7D26E6">
            <input type="text"  class="hex-in" id="colorB-hex" value="#7D26E6" maxlength="7" spellcheck="false">
          </div>
        </div>

        <label class="section-label">Background</label>

        <div class="ctrl">
          <label class="ctrl-label">Gradient color</label>
          <div class="color-row">
            <input type="color" class="color-swatch" id="gradColorPick" value="#7D26E6">
            <input type="text"  class="hex-in" id="gradColor-hex" value="#7D26E6" maxlength="7" spellcheck="false">
          </div>
        </div>

        <div class="ctrl">
          <label class="ctrl-label">Gradient diameter <span data-val="grad-diameter-slider"></span></label>
          <input type="range" class="slider" id="grad-diameter-slider" min="0" max="100" value="50">
        </div>

        <div class="ctrl">
          <label class="ctrl-label">Gradient density <span data-val="grad-density-slider"></span></label>
          <input type="range" class="slider" id="grad-density-slider" min="0" max="100" value="60">
        </div>

        <label class="section-label">Particles</label>

        <div class="ctrl row">
          <label class="ctrl-label">Enabled</label>
          <label class="toggle-switch">
            <input type="checkbox" id="particles-toggle" checked>
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
          </label>
        </div>

        <div class="ctrl">
          <label class="ctrl-label">Count <span data-val="count-slider"></span></label>
          <input type="range" class="slider" id="count-slider" min="0" max="3000" step="50" value="400">
        </div>

        <div class="ctrl">
          <label class="ctrl-label">Blend mode</label>
          <select id="particle-blend">
            <option value="lighter">Add (glow)</option>
            <option value="screen">Screen</option>
            <option value="source-over">Normal</option>
            <option value="lighten">Lighten</option>
            <option value="color-dodge" selected>Color dodge</option>
            <option value="overlay">Overlay</option>
            <option value="difference">Difference</option>
            <option value="exclusion">Exclusion</option>
            <option value="multiply">Multiply</option>
          </select>
        </div>

        <div class="ctrl">
          <label class="ctrl-label">Color</label>
          <div class="color-row">
            <input type="color" class="color-swatch" id="floatColorPick" value="#929292">
            <input type="text"  class="hex-in" id="floatColor-hex" value="#929292" maxlength="7" spellcheck="false">
          </div>
        </div>

        <div class="ctrl">
          <label class="ctrl-label">Inside color</label>
          <div class="color-row">
            <input type="color" class="color-swatch" id="insideColorPick" value="#7D26E6">
            <input type="text"  class="hex-in" id="insideColor-hex" value="#7D26E6" maxlength="7" spellcheck="false">
          </div>
        </div>

        <div class="ctrl">
          <label class="ctrl-label">Pull force <span data-val="pull-slider"></span></label>
          <input type="range" class="slider" id="pull-slider" min="0" max="100" value="1">
        </div>

        <div class="ctrl">
          <label class="ctrl-label">Float / trail <span data-val="elastic-slider"></span></label>
          <input type="range" class="slider" id="elastic-slider" min="1" max="100" value="1">
        </div>

        <div class="ctrl">
          <label class="ctrl-label">Reach <span data-val="reach-slider"></span></label>
          <input type="range" class="slider" id="reach-slider" min="1" max="100" value="45">
        </div>

        <div class="ctrl">
          <label class="ctrl-label">Cloud size <span data-val="cloud-size-slider"></span></label>
          <input type="range" class="slider" id="cloud-size-slider" min="1" max="100" value="6">
        </div>

        <div class="ctrl">
          <label class="ctrl-label">Breakthrough <span data-val="breakthrough-slider"></span></label>
          <input type="range" class="slider" id="breakthrough-slider" min="0" max="100" value="45">
        </div>

        <div class="ctrl">
          <button class="btn-outline" id="reset-particles">↺ Reset particles</button>
        </div>

        <label class="section-label">Membrane</label>

        <div class="ctrl row">
          <label class="ctrl-label">Enabled</label>
          <label class="toggle-switch">
            <input type="checkbox" id="membrane-toggle" checked>
            <span class="toggle-track"><span class="toggle-thumb"></span></span>
          </label>
        </div>

        <div class="ctrl">
          <label class="ctrl-label">Color</label>
          <div class="color-row">
            <input type="color" class="color-swatch" id="membraneColorPick" value="#7D26E6">
            <input type="text"  class="hex-in" id="membraneColor-hex" value="#7D26E6" maxlength="7" spellcheck="false">
          </div>
        </div>

        <div class="ctrl">
          <label class="ctrl-label">Gap <span data-val="membrane-gap-slider"></span></label>
          <input type="range" class="slider" id="membrane-gap-slider" min="0" max="100" value="30">
        </div>

        <div class="ctrl">
          <label class="ctrl-label">Opacity <span data-val="membrane-opacity-slider"></span></label>
          <input type="range" class="slider" id="membrane-opacity-slider" min="0" max="100" value="45">
        </div>

        <div class="ctrl">
          <label class="ctrl-label">Delay ms <span data-val="membrane-delay-slider"></span></label>
          <input type="range" class="slider" id="membrane-delay-slider" min="0" max="4000" step="50" value="200">
        </div>

        <div class="btn-stack">
          <button class="btn-outline" id="play-pause">⏸ Pause</button>
          <button class="btn-outline" id="record-btn">⏺ Record</button>
          <button class="btn-filled" id="export-png">↓ PNG</button>
        </div>

      </div>
    </aside>

    <div class="canvas-wrapper">
      <div id="canvas-container"></div>
    </div>

  </div>

  <script>
    const panel     = document.getElementById('panel');
    const toggleBtn = document.getElementById('panelToggle');
    const arrow     = document.getElementById('toggleArrow');
    let panelOpen = true;
    toggleBtn.addEventListener('click', () => {
      panelOpen = !panelOpen;
      panel.classList.toggle('closed', !panelOpen);
      arrow.textContent = panelOpen ? '←' : '→';
    });

    // Live value readouts next to each slider.
    document.querySelectorAll('span[data-val]').forEach(span => {
      const input = document.getElementById(span.getAttribute('data-val'));
      const sync = () => { span.textContent = input.value; };
      input.addEventListener('input', sync);
      sync();
    });

    function wireColor(pickId, hexId) {
      const pick = document.getElementById(pickId);
      const hex  = document.getElementById(hexId);
      pick.addEventListener('input', e => { hex.value = e.target.value; if (window.onColorChange) onColorChange(); });
      hex.addEventListener('input', e => {
        if (/^#[0-9a-fA-F]{6}$/.test(e.target.value)) { pick.value = e.target.value; if (window.onColorChange) onColorChange(); }
      });
    }
    wireColor('colorAPick', 'colorA-hex');
    wireColor('colorBPick', 'colorB-hex');
    wireColor('floatColorPick', 'floatColor-hex');
    wireColor('insideColorPick', 'insideColor-hex');
    wireColor('membraneColorPick', 'membraneColor-hex');
    wireColor('gradColorPick', 'gradColor-hex');
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="sketch.js"></script>
</body>
</html>
