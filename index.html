<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ghisha Modulator | v13</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <header class="topbar">
    <span class="topbar-title">Ghisha Modulator  |  v13</span>
  </header>

  <div class="layout">

    <aside class="panel" id="panel">
      <div class="panel-content">

        <div class="ctrl">
          <label class="ctrl-label">Aspect ratio</label>
          <select id="sel-ratio">
            <option value="1:1" selected>1 : 1 — Square</option>
            <option value="5:4">5 : 4 — Landscape</option>
            <option value="4:3">4 : 3 — Landscape</option>
            <option value="16:10">16 : 10 — Landscape</option>
            <option value="16:9">16 : 9 — Landscape</option>
            <option value="4:5">4 : 5 — Portrait</option>
            <option value="3:4">3 : 4 — Portrait</option>
            <option value="9:16">9 : 16 — Portrait</option>
            <option value="1:1.41421">A4 — Portrait</option>
            <option value="1.41421:1">A4 — Landscape</option>
          </select>
        </div>

        <br>

        <label class="section-label">Shape</label>

        <div class="ctrl">
          <label class="ctrl-label">Shape seed <span data-val="noise-seed-slider"></span></label>
          <input type="range" class="slider" id="noise-seed-slider" min="0" max="1000" value="0">
        </div>

        <div class="ctrl">
          <label class="ctrl-label">Smoothness <span data-val="noise-scale-slider"></span></label>
          <input type="range" class="slider" id="noise-scale-slider" min="1" max="4" step="0.1" value="3">
        </div>

        <br>

        <label class="section-label">Sphere</label>

        <div class="ctrl">
          <label class="ctrl-label">Glow intensity <span data-val="glow-slider"></span></label>
          <input type="range" class="slider" id="glow-slider" min="1" max="100" value="18">
        </div>

        <div class="ctrl">
          <label class="ctrl-label">Quality <span data-val="quality-slider"></span></label>
          <input type="range" class="slider" id="quality-slider" min="1" max="100" value="80">
        </div>

        <div class="ctrl">
          <label class="ctrl-label">Position X <span data-val="sphere-x-slider"></span></label>
          <input type="range" class="slider" id="sphere-x-slider" min="-200" max="200" value="0">
        </div>

        <div class="ctrl">
          <label class="ctrl-label">Position Y <span data-val="sphere-y-slider"></span></label>
          <input type="range" class="slider" id="sphere-y-slider" min="-200" max="200" value="0">
        </div>

        <div class="ctrl">
          <label class="ctrl-label">Scale <span data-val="sphere-scale-slider"></span></label>
          <input type="range" class="slider" id="sphere-scale-slider" min="20" max="250" value="100">
        </div>

        <br>

        <label class="section-label">Gradient A</label>

        <div class="ctrl">
          <label class="ctrl-label">Gradient diameter <span data-val="grad-diameter-slider"></span></label>
          <input type="range" class="slider" id="grad-diameter-slider" min="0" max="100" value="50">
        </div>
        <div class="ctrl">
          <label class="ctrl-label">Gradient density <span data-val="grad-density-slider"></span></label>
          <input type="range" class="slider" id="grad-density-slider" min="0" max="100" value="55">
        </div>
        <div class="ctrl">
          <label class="ctrl-label">Gradient opacity <span data-val="grad-opacity-slider"></span></label>
          <input type="range" class="slider" id="grad-opacity-slider" min="0" max="100" value="50">
        </div>
        <div class="ctrl">
          <label class="ctrl-label">Position X <span data-val="grad-x-slider"></span></label>
          <input type="range" class="slider" id="grad-x-slider" min="-100" max="100" value="0">
        </div>
        <div class="ctrl">
          <label class="ctrl-label">Position Y <span data-val="grad-y-slider"></span></label>
          <input type="range" class="slider" id="grad-y-slider" min="-100" max="100" value="0">
        </div>

        <br>

        <label class="section-label">Gradient B</label>

        <div class="ctrl">
          <label class="ctrl-label">Gradient color</label>
          <div class="swatch-row" id="gradB-swatches">
            <button type="button" class="swatch-btn" data-color="#4D0079" style="background:#4D0079"></button>
            <button type="button" class="swatch-btn is-selected" data-color="#8C31EC"
              style="background:#8C31EC"></button>
            <button type="button" class="swatch-btn" data-color="#CF50FF" style="background:#CF50FF"></button>
            <button type="button" class="swatch-btn" data-color="#FF65E9" style="background:#FF65E9"></button>
            <button type="button" class="swatch-btn" data-color="#F5A9FF" style="background:#F5A9FF"></button>
          </div>
        </div>

        <div class="ctrl">
          <label class="ctrl-label">Gradient diameter <span data-val="gradB-diameter-slider"></span></label>
          <input type="range" class="slider" id="gradB-diameter-slider" min="0" max="100" value="50">
        </div>
        <div class="ctrl">
          <label class="ctrl-label">Gradient density <span data-val="gradB-density-slider"></span></label>
          <input type="range" class="slider" id="gradB-density-slider" min="0" max="100" value="40">
        </div>
        <div class="ctrl">
          <label class="ctrl-label">Gradient opacity <span data-val="gradB-opacity-slider"></span></label>
          <input type="range" class="slider" id="gradB-opacity-slider" min="0" max="100" value="50">
        </div>
        <div class="ctrl">
          <label class="ctrl-label">Position X <span data-val="gradB-x-slider"></span></label>
          <input type="range" class="slider" id="gradB-x-slider" min="-100" max="100" value="-50">
        </div>
        <div class="ctrl">
          <label class="ctrl-label">Position Y <span data-val="gradB-y-slider"></span></label>
          <input type="range" class="slider" id="gradB-y-slider" min="-100" max="100" value="-50">
        </div>

        <br>

        <label class="section-label">Background</label>

        <div class="ctrl">
          <div class="toggle-row" id="bg-toggle">
            <button type="button" class="toggle-btn is-selected" data-bg="#000000">Black</button>
            <button type="button" class="toggle-btn" data-bg="#ffffff">White</button>
          </div>
        </div>

        <br>

        <label class="section-label">Particles</label>

        <div class="ctrl">
          <label class="ctrl-label">Count <span data-val="count-slider"></span></label>
          <input type="range" class="slider" id="count-slider" min="0" max="400" step="10" value="400">
        </div>

        <button class="btn-outline" id="reset-particles">↺ Reset particles</button>

        <br>

        <label class="section-label">Membrane</label>

        <div class="ctrl">
          <label class="ctrl-label">Type</label>
          <select id="membrane-type">
            <option value="solid">Solid 2D</option>
            <option value="points" selected>Points</option>
          </select>
        </div>

        <br>

        <div class="btn-stack">
          <button class="btn-outline" id="play-pause">⏸ Pause</button>
          <div class="ctrl">
            <div class="toggle-row" id="quality-toggle">
              <button type="button" class="toggle-btn is-selected" data-quality="1080">1080p</button>
              <button type="button" class="toggle-btn" data-quality="4k">4K</button>
            </div>
          </div>
          <button class="btn-record" id="record-btn">⏺ Record</button>
          <div class="btn-row">
            <button class="btn-filled" id="export-png">↓ PNG</button>
            <button class="btn-filled" id="export-jpg">↓ JPG</button>
          </div>
        </div>

      </div>
    </aside>

    <div class="canvas-wrapper">
      <div id="canvas-container"></div>
    </div>

  </div>

  <div class="keys-hint">
    <span><b>S</b>Save PNG</span>
    <span><b>R</b>Record</span>
  </div>

  <img class="brand-logo" src="Ghisha_logo.svg" alt="Ghisha">

  <script>
    // Live value readouts next to each slider.
    document.querySelectorAll('span[data-val]').forEach(span => {
      const input = document.getElementById(span.getAttribute('data-val'));
      const sync = () => { span.textContent = input.value; };
      input.addEventListener('input', sync);
      sync();
    });
  </script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="sketch.js"></script>
</body>

</html>
